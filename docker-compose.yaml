version: '3.9'

services:
  backend_wsgi:
    container_name: backend_wsgi
    build:
      context: .
      dockerfile: /docker/backend_wsgi/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - database

  backend_asgi:
    container_name: backend_asgi
    build:
      context: .
      dockerfile: /docker/backend_asgi/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    depends_on:
      - database

  database:
    container_name: database
    build:
      context: .
      dockerfile: /docker/database/Dockerfile
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - 3000:3000
    depends_on:
      - backend_wsgi
      - backend_asgi
