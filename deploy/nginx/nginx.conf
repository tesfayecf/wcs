events {}

http {

    upstream backend_wsgi {
        server backend_wsgi:8000;
    }

    upstream backend_asgi {
        server backend_asgi:8080;
    }

    upstream frontend {
        server frontend:3000;
    }

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=10g inactive=60m use_temp_path=off;

    server {
        server_name www.WCS.com WCS.com;
        listen 80;

        location / {
            proxy_pass http://frontend;
            include /etc/nginx/mime.types;

            # Enable caching for static assets
            expires 1w;
            add_header Cache-Control "public, max-age=604800, immutable"; 
        }

        location /api {
            proxy_pass http://backend_wsgi;
            include /etc/nginx/mime.types;

            # Enable caching for API responses
            proxy_set_header Host $host;
            proxy_cache my_cache;                # Cache configuration name
            proxy_cache_valid 200 302 10m;       # Cache responses for 10 minutes
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_ignore_headers Cache-Control;
        }

        # WebSocket support for /ws path
        location /ws {
            proxy_pass http://backend_asgi;
            include /etc/nginx/mime.types;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Enable Gzip compression
        gzip on;
        gzip_comp_level 6;
        gzip_min_length 1000;
        gzip_types text/plain text/css application/json application/javascript application/xml;

        # Security Headers
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';";

        # Disable server tokens
        server_tokens off;
    }

    # Other server blocks for HTTPS and additional security headers go here

    # Security Enhancements:
    # - Implement SSL for HTTPS
    # - Other security headers can be added here
    # - Set appropriate connection limits and logging
    # - Fine-tune worker processes and connections
    # - Regular updates, monitoring, and tuning
}
