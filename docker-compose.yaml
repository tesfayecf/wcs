version: '3.9'

services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: /docker/backend/Dockerfile
    # command: gunicorn /backend/backend.asgi
    ports:
      - "8000:8000"
      - "8001:8001"
    env_file:
      - ./backend/.env
    # depends_on:
    #   - database

  database:
    container_name: database
    build:
      context: .
      dockerfile: /docker/database/Dockerfile
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - 3000:3000
      # depends_on:
      # - backend
      # nginx:
      #   container_name: nginx
      #   build:
      #     context: .
      #     dockerfile: docker/nginx/Dockerfile
      #   volumes:
      #     - static:/frontend/static
      # ports:
      #   - 80:80

      # emqx:
      #   container_name: emqx
      #   image: emqx/emqx
      #   ports:
      #     - 1883:1883
      #     - 8083:8083
      #     - 8883:8883
      #     - 8084:8084
      #     - 18083:18083

volumes:
  db_data:
